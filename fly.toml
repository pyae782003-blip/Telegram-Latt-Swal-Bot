# Fly.io deployment configuration for Multi-tenant Telegram Bot
app = "telegram-multitenant-bot"
primary_region = "sin"

[build]

[env]
  PYTHONUNBUFFERED = "1"
  DATABASE_PATH = "/data/store.db"
  PORT = "8080"

# If using Supabase / PostgreSQL, set DATABASE_URL via `fly secrets set DATABASE_URL="..."` (no volume needed).
# If using SQLite instead, create a volume: `fly volumes create store_data --size 1 --region sin`
# [mounts]
#   source = "store_data"
#   destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
